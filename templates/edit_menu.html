<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit menu</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    />
  </head>
  <div class="kembali">
    <a href="/"><button>Kembali ke Beranda</button> </a>
  </div>
  <section class="edit-page">
    <h2 style="color: white">Edit Data menu</h2>
    <form
      class="menu-input"
      action="{{ url_for('edit_menu', id=menu['id']) }}"
      method="POST"
      enctype="multipart/form-data"
    >
      <input type="text" name="nama_menu" value="{{ menu['nama_menu'] }}" required />
      <input
        type="text"
        name="harga"
        value="{{ menu['harga'] }}"
        required
      />
      <input
      type="text"
      name="deskripsi"
      value="{{ menu['deskripsi'] }}"
      required
    />
      <div>
        <label>Pilih Gambar menu</label>
        <input type="file" name="img" class="form-control" />
        <!-- Gambar sebelumnya disimpan sebagai hidden input -->
        <input type="hidden" name="existing_img" value="{{ menu['img'] }}" />
        <img src="{{ menu['img'] }}" alt="menu Image" width="100" />
      </div>
      <input
        type="submit"
        name="submit"
        class="btn btn-primary"
        value="Update"
      />
    </form>
  </section>
</html>
